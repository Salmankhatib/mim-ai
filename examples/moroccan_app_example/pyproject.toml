[tool.poetry]
name = "moroccan-app-example"
version = "0.1.0"
description = "FastAPI example app for Moroccan Darija AI using mim-ai"
authors = ["MIM Community <team@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.30.0,<1.0.0"
jinja2 = ">=3.1.0,<4.0.0"
python-multipart = ">=0.0.9,<1.0.0"
pydub = ">=0.25.1,<1.0.0"
numpy = ">=1.26.0,<3.0.0"
mim-ai = { path = "../..", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
