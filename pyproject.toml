[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mim-ai"
version = "0.1.0"
description = "A configuration-first Python SDK for building production-grade Moroccan Darija AI applications — normalizer, anonymizer, chatbot, voice pipeline, and Law 09-08 audit trail."

readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Salman KHATIB", email = "slamankhatib06@gmail.com" },
]
keywords = [
    "nlp", "darija", "arabic", "moroccan", "chatbot",
    "voice-agent", "stt", "tts", "anonymizer", "audit",
    "law-09-08", "iso-42001", "arabizi", "mistral", "mntra"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

# Core dependencies
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/salmankhatib06/mim-ai"
Repository = "https://github.com/salmankhatib06/mim-ai"
Documentation = "https://github.com/salmankhatib06/mim-ai/tree/main/docs/EN"
"Bug Tracker" = "https://github.com/salmankhatib06/mim-ai/issues"
Changelog = "https://github.com/salmankhatib06/mim-ai/blob/main/CHANGELOG.md"

[project.scripts]
mim-init = "mim_ai.__main__:init_main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydub>=0.25.1,<1.0.0",
]
voice = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]
anonymizer = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy<3.8; python_version < '3.10'",
]
redis = [
    "redis>=5.0.0",
]
postgresql = [
    "psycopg[binary]>=3.1.0",
]
mysql = [
    "PyMySQL>=1.1.0",
]
mongodb = [
    "pymongo>=4.8.0",
]
production = [
    "psycopg[binary]>=3.1.0",
    "PyMySQL>=1.1.0",
    "pymongo>=4.8.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy<3.8; python_version < '3.10'",
    "redis>=5.0.0",
]
all = [
    "psycopg[binary]>=3.1.0",
    "PyMySQL>=1.1.0",
    "pymongo>=4.8.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy<3.8; python_version < '3.10'",
    "redis>=5.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mim_ai*"]

[tool.setuptools.package-data]
mim_ai = [
    "default_config.yaml",
    "audit/schema.sql",
    "intents/*.yaml",
    "normalizer/data/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "requires_spacy: requires the separately downloaded English spaCy model",
]
