[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mim-ai"
version = "0.1.0"
description = "A configuration-based library offering ready-to-use AI modules tailored to Morocco."

readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "khatib salman", email = "slamankhatib06@gmail.com" },
]
keywords = ["nlp", "darija", "arabic", "chatbot", "voice-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "langdetect>=1.0.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
mim-init = "mim_ai.config:write_default_config"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
postgresql = [
    "psycopg[binary]>=3.1.0",
]
mysql = [
    "PyMySQL>=1.1.0",
]
mongodb = [
    "pymongo>=4.8.0",
]
production = [
    "psycopg[binary]>=3.1.0",
    "PyMySQL>=1.1.0",
    "pymongo>=4.8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mim_ai*"]

[tool.setuptools.package-data]
mim_ai = [
    "default_config.yaml",
    "intents/*.yaml",
    "normalizer/data/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
