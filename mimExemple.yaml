# mim.yaml — copy, edit, done.

normalizer:
  enabled: true
  unify_alef: true
  unify_ya: true
  unify_ta_marbuta: false
  remove_diacritics: true
  preserve_urls: true
  arabizi_dict_path: ./darija/arabizi.yaml
  skip_words_path: ./darija/skip_words.yaml

llm:
  enabled: true
  base_url: https://api.mntra.ma/v1
  api_key_env: MNTRA_API_KEY
  model: mntra/mistral-darija
  temperature: 0.7
  max_tokens: 1024
  timeout_ms: 30000
  extra: {}                         # anything else passed verbatim

stt:
  enabled: true
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  model: whisper-large-v3-turbo
  language: ar
  timeout_ms: 20000

tts:
  enabled: true
  base_url: http://localhost:8000/v1
  api_key_env: LOCAL_TTS_KEY
  model: darija-tts
  voice: default
  format: wav
  timeout_ms: 20000

chatbot:
  enabled: true
  system_prompt: darija
  use_normalizer: true
  use_intents: true
  history_backend: sqlite
  history_dsn: ./sessions/chat.db
  max_history_turns: 20

voice:
  enabled: true
  use_normalizer: true
  use_intents: true
  use_audit_log: true
  vad:
    enabled: true
    threshold: 0.5
    min_silence_ms: 500
  audio:
    input_device: null
    output_device: null
    sample_rate: 16000
    chunk_ms: 32
  max_record_seconds: 30
  silence_timeout_ms: 1500

intents:
  enabled: true
  strategy: hybrid
  intents_path: ./myapp/intents.yaml
  threshold: 0.55

audit:
  enabled: true
  backend: sqlite
  db_path: ./audit/audit.db
  retention_days: 90
  hash_chain: true

logs:
  enabled: true
  backend: sqlite
  db_path: ./logs/normalizer.db
  retention_days: 7