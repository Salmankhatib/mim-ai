# config.yaml
# Copy this file into your project root and adjust values.
# This is the canonical config used by MIM at runtime.

normalizer:
  enabled: true
  cleaning:
    preserve_urls: true
    strip_tatweel: true
    strip_urls: false
  rules:
    unify_alef: false
    unify_ya: true
    unify_ta_marbuta: false
    remove_diacritics: true
    normalize_digits: true
    arabizi_dict_path: ""
    skip_words_path: ""

anonymizer:
  enabled: true
  default_operators:
    DEFAULT: replace
    CIN_MA: replace
    PHONE_MA: mask
  custom_patterns: []

chatbot:
  enabled: true
  system_prompt: darija
  language: auto
  use_intents: true
  use_normalizer: true
  use_audit_log: true
  use_normalizer_log: true
  enable_tools: true
  max_tool_calls: 5
  max_history_turns: 20
  session_ttl_seconds: 3600
  history_backend: memory
  history_dsn: null
  llm_provider: openai
  llm_model: mntra/mistral-darija
  llm_endpoint: https://api.mntra.ma/v1
  llm_api_key_env: MNTRA_API_KEY
  llm_temperature: 0.7
  llm_max_tokens: 1024
  llm_timeout_ms: 30000
  llm_extra_headers: {}
  llm_extra_params: {}
  params: {}
  roles: {}

voice:
  enabled: true
  use_normalizer: true
  use_intents: true
  use_audit_log: true
  use_chatbot: true
  max_record_seconds: 30
  vad:
    enabled: true
    threshold: 0.015
    min_silence_ms: 700
    start_timeout_ms: 10000
    pre_roll_ms: 200
    frame_ms: 20
    min_speech_ms: 100
  audio:
    input_device: null
    output_device: null
    sample_rate: 16000
    chunk_ms: 32

stt:
  enabled: true
  provider: openai
  model: whisper-1
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  language: ar
  timeout_ms: 20000
  temperature: 0.0
  extra: {}

tts:
  enabled: true
  provider: openai
  model: tts-1
  voice: nova
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  format: wav
  timeout_ms: 20000
  extra: {}

intents:
  enabled: true
  strategy: hybrid
  intents_path: ""
  threshold: 0.55

audit:
  enabled: true
  backend: sqlite
  db_path: ./audit/audit.db
  jsonl_path: ./audit/
  database_url: null
  collection: audit_events
  retention_days: 90
  hash_chain: true
  app_version: mim-ai 0.1.0
  purge_on_start: true

logs:
  enabled: true
  backend: sqlite
  db_path: ./logs/normalizer.db
  jsonl_path: ./logs/
  database_url: null
  collection: normalizer_events
  retention_days: 7
  capture_jargon_used: true
  capture_jargon_skipped: true
  capture_skipped_tokens: false
  max_tokens_per_event: 50
  sample_rate: 1.0
  purge_on_start: true
